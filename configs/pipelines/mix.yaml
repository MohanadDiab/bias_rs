# Mix-runs: compose L, O, and C at the same percent (order L then O then C).
name: mix
seed: 42

noise:
  family: Mix
  ratio: 0

experts:
  - config: configs/training/models/yolo26n.yaml
  - config: configs/training/models/rfdetr_nano.yaml
  - config: configs/training/models/dino.yaml
  - config: configs/training/models/rtmdet.yaml

pipeline:
  moe: simple
  combine: { method: wbf, iou: 0.55 }

sweep:
  datasets:
    - configs/training/ai_tod_v1.yaml
    - configs/training/ai_tod_v2.yaml
    - configs/training/dota_1024_v1.yaml
    - configs/training/dota_1024_v15.yaml
    - configs/training/hit_uav.yaml
    - configs/training/hrsc2016_ms_640.yaml
    - configs/training/plant_detection_640.yaml
  noise_ratios: [0, 10, 30, 50]
  moe: [simple, calibrated, gated, learned]
