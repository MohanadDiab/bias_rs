# Localization runs: isolated box jitter. Fusion is the factor of interest.
family: L
datasets: all
noise_ratios: [0, 1, 2, 5, 10, 20, 30, 50]
expert_sets: [asymmetric]
experts:
  asymmetric:
    - config: configs/training/models/yolo26n.yaml
    - config: configs/training/models/rfdetr_nano.yaml
    - config: configs/training/models/dino.yaml
    - config: configs/training/models/rtmdet.yaml
fusion: [nms, soft_nms, wbf]
moe: [simple]
notes: >
  L-runs hold experts fixed and vary fusion. Optional calibrated wrapper is
  not required to read the fusion main effect.
